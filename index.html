<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沙特幸運抽籤大轉盤</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            color: #f8fafc;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Glow & Pointer Styles */
        .glow-btn {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.5);
            transition: all 0.3s ease;
        }
        .glow-btn:hover:not(:disabled) {
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.8);
            transform: scale(1.05);
        }

        .glow-pointer {
            filter: drop-shadow(0 4px 10px rgba(239, 68, 68, 0.8));
        }

        #wheelCanvas {
            filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.6));
        }

        /* Modal Pop Animation */
        @keyframes modalPop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-modal {
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
    </style>
</head>
<body class="flex flex-col font-sans min-h-screen selection:bg-pink-500 selection:text-white">

    <header class="w-full glass-panel sticky top-0 z-30 px-4 py-3 border-b border-slate-700/50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center text-white text-xl font-bold shadow-lg shadow-pink-500/30">
                    <i class="fa-solid fa-dharmachakra"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black bg-clip-text text transparent bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-300">
                        沙特幸運抽籤大轉盤
                    </h1>
                    <p class="text-xs text-slate-400 hidden sm:block">自由編輯選項 / 課堂號碼抽籤神器</p>
                </div>
            </div>

            <div class="flex items-center space-x-2 sm:space-x-3">
                <button id="soundToggleBtn" class="p-2.5 rounded-xl glass-card text-slate-300 hover:text-white hover:bg-white/10 transition-colors" title="切換音效">
                    <i class="fa-solid fa-volume-high text-lg"></i>
                </button>
                <button id="fullscreenBtn" class="p-2.5 rounded-xl glass-card text-slate-300 hover:text-white hover:bg-white/10 transition-colors" title="全螢幕">
                    <i class="fa-solid fa-expand text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Left Column: Interactive Wheel Canvas -->
        <section class="lg:col-span-7 xl:col-span-8 flex flex-col items-center justify-center glass-panel rounded-3xl p-4 sm:p-8 relative overflow-hidden">
            <div class="absolute -top-24 -left-24 w-72 h-72 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -right-24 w-72 h-72 bg-pink-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <!-- Top Needle Pointer -->
            <div class="relative z-10 w-full max-w-[500px] flex justify-center items-center">
                <div class="absolute -top-5 z-20 glow-pointer transition-transform duration-100 origin-bottom" id="wheelPointer">
                    <svg width="46" height="56" viewBox="0 0 46 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M23 56L0.483244 14.75L45.5168 14.75L23 56Z" fill="#EF4444"/>
                        <circle cx="23" cy="16" r="12" fill="#F8FAFC" stroke="#DC2626" stroke-width="4"/>
                        <circle cx="23" cy="16" r="5" fill="#DC2626"/>
                    </svg>
                </div>

                <!-- Canvas Wrapper -->
                <div class="relative w-full aspect-square max-w-[480px] p-2 flex items-center justify-center">
                    <canvas id="wheelCanvas" width="900" height="900" class="w-full h-full object-contain cursor-pointer rounded-full"></canvas>
                    
                    <!-- Center Start Button -->
                    <button id="centerSpinBtn" class="absolute z-20 w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-600 text-white font-black text-lg sm:text-xl border-4 border-white shadow-2xl glow-btn flex flex-col items-center justify-center active:scale-95 transition-transform">
                        <span>開始</span>
                        <span class="text-xs font-normal opacity-90">SPIN</span>
                    </button>
                </div>
            </div>

            <!-- Spin Controls -->
            <div class="w-full max-w-md mt-6 flex flex-col sm:flex-row items-center justify-between gap-4 z-10">
                <button id="mainSpinBtn" class="w-full sm:w-auto flex-1 py-3.5 px-8 rounded-2xl bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold text-lg shadow-lg shadow-purple-500/30 flex items-center justify-center space-x-2 transition-all active:scale-95">
                    <i class="fa-solid fa-play"></i>
                    <span>開始抽籤 / 旋轉</span>
                </button>

                <button id="resetWheelBtn" class="w-full sm:w-auto py-3.5 px-5 rounded-2xl glass-card hover:bg-white/10 text-slate-300 hover:text-white font-semibold flex items-center justify-center space-x-2 transition-all">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>重置轉盤</span>
                </button>
            </div>
        </section>

        <!-- Right Column: Editor & Options Sidebar -->
        <aside class="lg:col-span-5 xl:col-span-4 space-y-6">
            
            <!-- Custom Text Editor Panel -->
            <div class="glass-panel rounded-3xl p-5 space-y-4">
                <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                    <h2 class="text-base font-bold text-slate-100 flex items-center space-x-2">
                        <i class="fa-solid fa-pen-to-square text-pink-400"></i>
                        <span>自由編輯選項</span>
                    </h2>
                    <span id="remainingCountBadge" class="text-xs bg-pink-500/20 text-pink-300 font-semibold px-2.5 py-1 rounded-full border border-pink-500/30">
                        29 個選項
                    </span>
                </div>

                <div>
                    <label for="optionsTextarea" class="text-xs text-slate-400 mb-1.5 block">輸入轉盤項目（每一行為一個選項）：</label>
                    <textarea id="optionsTextarea" rows="6" class="w-full p-3 rounded-xl bg-slate-900/70 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-pink-500 transition-colors font-mono resize-none" placeholder="輸入選項，每行一個..."></textarea>
                </div>

                <div class="flex items-center justify-between gap-2 pt-1">
                    <button id="applyDefaultBtn" class="py-2 px-3 rounded-xl glass-card text-xs text-slate-300 hover:text-white hover:bg-white/10 flex items-center space-x-1 transition-all">
                        <i class="fa-solid fa-list-ol text-purple-400"></i>
                        <span>載入預設(1-14, 21-35號)</span>
                    </button>

                    <button id="updateOptionsBtn" class="py-2 px-4 rounded-xl bg-pink-500 hover:bg-pink-600 text-white font-bold text-xs shadow-md shadow-pink-500/20 flex items-center space-x-1.5 transition-all active:scale-95">
                        <i class="fa-solid fa-arrows-rotate"></i>
                        <span>更新轉盤</span>
                    </button>
                </div>

                <!-- Auto-Remove Toggle Switch -->
                <div class="flex items-center justify-between p-3 rounded-2xl glass-card mt-3">
                    <div class="pr-2">
                        <p class="text-xs font-semibold text-slate-200">抽中後自動移除該選項</p>
                        <p class="text-[11px] text-slate-400">適合課堂抽籤，防止重複抽中</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="autoRemoveToggle" class="sr-only peer">
                        <div class="w-10 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-pink-500"></div>
                    </label>
                </div>
            </div>

            <!-- Draw History Panel -->
            <div class="glass-panel rounded-3xl p-5 flex flex-col h-[320px]">
                <div class="flex items-center justify-between border-b border-slate-700/60 pb-3 mb-3">
                    <h2 class="text-base font-bold text-slate-100 flex items-center space-x-2">
                        <i class="fa-solid fa-clock-rotate-left text-purple-400"></i>
                        <span>抽籤紀錄</span>
                    </h2>
                    <div class="flex items-center space-x-3">
                        <button id="copyHistoryBtn" class="text-xs text-slate-400 hover:text-purple-300 transition-colors flex items-center space-x-1">
                            <i class="fa-solid fa-copy"></i>
                            <span>複製</span>
                        </button>
                        <button id="clearHistoryBtn" class="text-xs text-slate-400 hover:text-pink-400 transition-colors flex items-center space-x-1">
                            <i class="fa-solid fa-trash-can"></i>
                            <span>清空</span>
                        </button>
                    </div>
                </div>

                <!-- History Items Scroll Container -->
                <div id="historyList" class="flex-1 overflow-y-auto space-y-2 pr-1">
                    <div id="emptyHistoryMsg" class="h-full flex flex-col items-center justify-center text-slate-500 space-y-2">
                        <i class="fa-solid fa-dice text-3xl opacity-50"></i>
                        <p class="text-xs">尚無抽籤紀錄，開始旋轉試試吧！</p>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <!-- Winner Modal -->
    <div id="resultModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel max-w-sm w-full rounded-3xl p-6 text-center shadow-2xl border border-pink-500/30 relative overflow-hidden animate-modal">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-48 h-2 bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 blur-sm"></div>

            <div class="w-16 h-16 bg-pink-500/20 border border-pink-500/40 rounded-2xl flex items-center justify-center mx-auto mb-4 text-pink-400 text-2xl shadow-inner">
                <i class="fa-solid fa-trophy animate-bounce"></i>
            </div>

            <h3 class="text-slate-400 text-xs font-semibold tracking-wider uppercase">🎉 抽中結果 🎉</h3>
            
            <div id="modalWinnerNumber" class="text-4xl sm:text-5xl font-black bg-clip-text text-transparent bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-300 my-4 tracking-tight break-words px-2">
                --
            </div>

            <p id="modalSubText" class="text-xs text-slate-400 mb-6">已紀錄至歷史列表中</p>

            <button id="closeModalBtn" class="w-full py-3 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold text-sm shadow-lg shadow-pink-500/30 transition-all active:scale-95">
                太棒了！
            </button>
        </div>
    </div>

    <script>
        // Web Audio Synthesizer Engine
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.soundEnabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playClick() {
                if (!this.soundEnabled) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(550, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.04);

                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.04);
                } catch(e) {}
            }

            playWin() {
                if (!this.soundEnabled) return;
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        try {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();

                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);

                            osc.connect(gain);
                            gain.connect(this.ctx.destination);

                            osc.start();
                            osc.stop(this.ctx.currentTime + 0.4);
                        } catch(e) {}
                    }, idx * 90);
                });
            }
        }

        const audio = new AudioEngine();
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        // Default Option Generator: 1-14 and 21-35
        function generateDefaultOptions() {
            const list = [];
            for (let i = 1; i <= 14; i++) list.push(`${i} 號`);
            for (let i = 21; i <= 35; i++) list.push(`${i} 號`);
            return list;
        }

        let options = generateDefaultOptions();
        let historyRecords = [];
        let currentRotation = 0; // In Radians
        let isSpinning = false;
        let lastSegmentIndex = -1;

        // Macaron & Pastel Vibrant Palette
        const COLOR_PALETTE = [
            '#ec4899', '#8b5cf6', '#6366f1', '#3b82f6', '#06b6d4',
            '#10b981', '#f59e0b', '#ef4444', '#f43f5e', '#d946ef',
            '#a855f7', '#4f46e5', '#0284c7', '#14b8a6', '#84cc16'
        ];

        function drawWheel() {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = width / 2 - 25;

            ctx.clearRect(0, 0, width, height);

            const numSegments = options.length;

            if (numSegments === 0) {
                // Empty state drawing
                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#1e293b';
                ctx.fill();
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 10;
                ctx.stroke();

                ctx.fillStyle = '#94a3b8';
                ctx.font = 'bold 36px "Noto Sans TC"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('無可用選項！', centerX, centerY);
                ctx.restore();
                return;
            }

            const sliceAngle = (2 * Math.PI) / numSegments;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentRotation);

            for (let i = 0; i < numSegments; i++) {
                const angle = i * sliceAngle;
                const text = options[i];
                const color = COLOR_PALETTE[i % COLOR_PALETTE.length];

                // Draw Slice Arc
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, angle, angle + sliceAngle);
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();

                // Slice Border Line
                ctx.strokeStyle = 'rgba(15, 23, 42, 0.35)';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#FFFFFF';

                // Truncate long text if necessary
                const label = text.length > 10 ? text.substring(0, 9) + '…' : text;
                
                // Adaptive font size
                let fontSize = 38;
                if (numSegments > 24) fontSize = 22;
                else if (numSegments > 16) fontSize = 28;
                else if (numSegments > 10) fontSize = 32;

                ctx.font = `800 ${fontSize}px "Noto Sans TC", sans-serif`;
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 4;

                ctx.fillText(label, radius - 35, 0);
                ctx.restore();
            }

            // Outer Ring Border
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 8;
            ctx.stroke();

            ctx.restore();
        }

        function spinWheel() {
            if (isSpinning || options.length === 0) return;

            audio.init();
            isSpinning = true;
            toggleButtons(true);

            const winnerIndex = Math.floor(Math.random() * options.length);
            const numSegments = options.length;
            const sliceAngle = (2 * Math.PI) / numSegments;

            // Target Sector center math
            const targetSectorCenter = winnerIndex * sliceAngle + sliceAngle / 2;
            const extraRounds = Math.floor(Math.random() * 3) + 6; // 6 to 8 full spins
            const targetRotation = (2 * Math.PI * extraRounds) + (1.5 * Math.PI - targetSectorCenter);

            const startRotation = currentRotation % (2 * Math.PI);
            const totalRotationNeeded = targetRotation - startRotation;

            const duration = 5000;
            const startTime = performance.now();

            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function animateSpin(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easedProgress = easeOutCubic(progress);

                currentRotation = startRotation + totalRotationNeeded * easedProgress;
                drawWheel();

                // Sound Click Detection
                const currentNormalizedAngle = (currentRotation % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
                const pointerAngle = (1.5 * Math.PI - currentNormalizedAngle + 2 * Math.PI) % (2 * Math.PI);
                const currentSegment = Math.floor(pointerAngle / sliceAngle);

                if (currentSegment !== lastSegmentIndex) {
                    audio.playClick();
                    triggerPointerJiggle();
                    lastSegmentIndex = currentSegment;
                }

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    isSpinning = false;
                    toggleButtons(false);
                    onSpinComplete(winnerIndex);
                }
            }

            requestAnimationFrame(animateSpin);
        }

        function triggerPointerJiggle() {
            const pointer = document.getElementById('wheelPointer');
            pointer.style.transform = 'rotate(-18deg)';
            setTimeout(() => {
                pointer.style.transform = 'rotate(0deg)';
            }, 60);
        }

        function onSpinComplete(winnerIndex) {
            const winningText = options[winnerIndex];
            
            audio.playWin();

            // Confetti Blast Effect
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });

            addHistoryRecord(winningText);

            const modal = document.getElementById('resultModal');
            const winnerNumEl = document.getElementById('modalWinnerNumber');
            const modalSubText = document.getElementById('modalSubText');

            winnerNumEl.textContent = winningText;

            const autoRemove = document.getElementById('autoRemoveToggle').checked;
            if (autoRemove) {
                options.splice(winnerIndex, 1);
                syncOptionsToTextarea();
                modalSubText.textContent = `已紀錄並自動移除（剩餘 ${options.length} 個選項）`;
                drawWheel();
            } else {
                modalSubText.textContent = '已紀錄至歷史列表中';
            }

            updateCountBadge();

            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function addHistoryRecord(text) {
            historyRecords.unshift(text);

            const historyList = document.getElementById('historyList');
            const emptyMsg = document.getElementById('emptyHistoryMsg');

            if (emptyMsg) {
                emptyMsg.remove();
            }

            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

            const item = document.createElement('div');
            item.className = 'flex items-center justify-between p-2.5 rounded-xl glass-card border-l-4 border-pink-500 animate-modal';
            item.innerHTML = `
                <div class="flex items-center space-x-2.5 overflow-hidden">
                    <span class="w-6 h-6 rounded-md bg-pink-500/20 text-pink-300 font-bold flex items-center justify-center text-xs flex-shrink-0">
                        ${historyRecords.length}
                    </span>
                    <span class="font-bold text-slate-100 text-sm truncate">${escapeHtml(text)}</span>
                </div>
                <span class="text-[11px] text-slate-400 font-mono flex-shrink-0 ml-2">${timeStr}</span>
            `;

            historyList.prepend(item);
        }

        function syncTextareaToOptions() {
            const textarea = document.getElementById('optionsTextarea');
            const lines = textarea.value.split('\n')
                .map(l => l.trim())
                .filter(l => l.length > 0);
            
            options = lines;
            updateCountBadge();
            drawWheel();
        }

        function syncOptionsToTextarea() {
            const textarea = document.getElementById('optionsTextarea');
            textarea.value = options.join('\n');
            updateCountBadge();
        }

        function updateCountBadge() {
            const badge = document.getElementById('remainingCountBadge');
            badge.textContent = `${options.length} 個選項`;
        }

        function toggleButtons(disabled) {
            const mainSpinBtn = document.getElementById('mainSpinBtn');
            const centerSpinBtn = document.getElementById('centerSpinBtn');
            const resetWheelBtn = document.getElementById('resetWheelBtn');
            const updateOptionsBtn = document.getElementById('updateOptionsBtn');
            const applyDefaultBtn = document.getElementById('applyDefaultBtn');

            [mainSpinBtn, centerSpinBtn, resetWheelBtn, updateOptionsBtn, applyDefaultBtn].forEach(btn => {
                btn.disabled = disabled;
                if (disabled) btn.classList.add('opacity-50', 'cursor-not-allowed');
                else btn.classList.remove('opacity-50', 'cursor-not-allowed');
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.addEventListener('load', () => {
            syncOptionsToTextarea();
            drawWheel();

            // Spin Triggers
            document.getElementById('mainSpinBtn').addEventListener('click', spinWheel);
            document.getElementById('centerSpinBtn').addEventListener('click', spinWheel);
            document.getElementById('wheelCanvas').addEventListener('click', spinWheel);

            // Option Editor Events
            document.getElementById('updateOptionsBtn').addEventListener('click', syncTextareaToOptions);
            
            document.getElementById('applyDefaultBtn').addEventListener('click', () => {
                if (isSpinning) return;
                options = generateDefaultOptions();
                syncOptionsToTextarea();
                currentRotation = 0;
                drawWheel();
            });

            // Reset Wheel Button
            document.getElementById('resetWheelBtn').addEventListener('click', () => {
                if (isSpinning) return;
                syncTextareaToOptions();
                currentRotation = 0;
                drawWheel();
            });

            // Modal Close
            document.getElementById('closeModalBtn').addEventListener('click', () => {
                const modal = document.getElementById('resultModal');
                modal.classList.add('opacity-0');
                setTimeout(() => modal.classList.add('hidden'), 300);
            });

            // History Copy Button
            document.getElementById('copyHistoryBtn').addEventListener('click', () => {
                if (historyRecords.length === 0) return;
                const textToCopy = historyRecords.join('\n');
                
                // Fallback copy implementation
                const tempTextarea = document.createElement('textarea');
                tempTextarea.value = textToCopy;
                document.body.appendChild(tempTextarea);
                tempTextarea.select();
                document.execCommand('copy');
                document.body.removeChild(tempTextarea);

                const copyBtn = document.getElementById('copyHistoryBtn');
                copyBtn.innerHTML = '<i class="fa-solid fa-check text-green-400"></i><span>已複製</span>';
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i><span>複製</span>';
                }, 1500);
            });

            // Clear History Button
            document.getElementById('clearHistoryBtn').addEventListener('click', () => {
                historyRecords = [];
                const historyList = document.getElementById('historyList');
                historyList.innerHTML = `
                    <div id="emptyHistoryMsg" class="h-full flex flex-col items-center justify-center text-slate-500 space-y-2">
                        <i class="fa-solid fa-dice text-3xl opacity-50"></i>
                        <p class="text-xs">尚無抽籤紀錄，開始旋轉試試吧！</p>
                    </div>
                `;
            });

            // Sound Toggle Button
            const soundBtn = document.getElementById('soundToggleBtn');
            soundBtn.addEventListener('click', () => {
                audio.soundEnabled = !audio.soundEnabled;
                soundBtn.innerHTML = audio.soundEnabled 
                    ? '<i class="fa-solid fa-volume-high text-lg"></i>' 
                    : '<i class="fa-solid fa-volume-xmark text-lg text-red-400"></i>';
            });

            // Fullscreen Toggle Button
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            });
        });
    </script>
</body>
</html>
